name: Nike Job Monitor

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python
        run: python monitor.py
